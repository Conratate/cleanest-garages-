    <path d="M660 320l14-4 3 12-10 5z" fill="#cdc1a8"/>
  </g>
  <path d="M600 60l-8 22 6 10-5 18" fill="none" stroke="#6f6758" stroke-width="1.5" opacity=".7"/>

  <!-- cobwebs -->
  <g fill="none" stroke="#efeae0" stroke-width="1.5" opacity=".75">
