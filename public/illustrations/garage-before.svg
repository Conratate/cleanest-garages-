  <circle cx="200" cy="530" r="18" fill="#c2410c"/>
  <path d="M182 530h36M200 512v36M188 516q10 14 0 28M212 516q-10 14 0 28" stroke="#431407" stroke-width="1.5" fill="none"/>
  <g transform="rotate(-80 190 586)">
    <rect x="166" y="556" width="48" height="62" rx="4" fill="#6b7280"/>
    <rect x="162" y="552" width="56" height="8" rx="3" fill="#4b5563"/>
    <path d="M178 566v44M190 566v44M202 566v44" stroke="#4b5563" stroke-width="2"/>
  </g>
  <g fill="#e7e2d6">
    <rect x="226" y="584" width="14" height="10" transform="rotate(15 233 589)"/>
    <rect x="246" y="590" width="12" height="8" transform="rotate(-20 252 594)"/>
    <circle cx="222" cy="575" r="4" fill="#7c8a58"/>
