    <ellipse cx="455" cy="330" rx="70" ry="36" opacity=".3"/>
    <ellipse cx="45" cy="300" rx="30" ry="70" opacity=".3"/>
    <ellipse cx="755" cy="260" rx="26" ry="60" opacity=".3"/>
    <ellipse cx="600" cy="250" rx="40" ry="18" opacity=".25"/>
  </g>
  <path d="M430 40v70M445 40v110M458 40v55" stroke="#86795f" stroke-width="7" stroke-linecap="round" opacity=".35"/>
  <path d="M540 185q-3 30 2 60M600 185q2 22-2 44" stroke="#8a5a36" stroke-width="5" stroke-linecap="round" opacity=".35"/>
  <g opacity=".9">
