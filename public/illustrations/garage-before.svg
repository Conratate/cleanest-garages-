  <circle cx="532" cy="556" r="27" fill="none" stroke="#2e2e2e" stroke-width="4" stroke-dasharray="6 5"/>
  <circle cx="532" cy="556" r="17" fill="#77716a"/>
  <g fill="none" stroke="#15803d" stroke-width="4">
    <ellipse cx="548" cy="478" rx="30" ry="9"/>
    <ellipse cx="548" cy="474" rx="24" ry="7"/>
    <path d="M578 478q20 10 10 30t18 20"/>
  </g>

  <!-- paint cans -->
  <rect x="578" y="552" width="40" height="42" fill="#8d99a5"/>
  <ellipse cx="598" cy="552" rx="20" ry="6" fill="#aeb8c2"/>
  <path d="M584 556q3 16 0 30" stroke="#d97706" stroke-width="5" fill="none" stroke-linecap="round"/>
  <rect x="610" y="566" width="30" height="30" fill="#a5a07a"/>
  <ellipse cx="625" cy="566" rx="15" ry="5" fill="#c2bd95"/>
  <rect x="598" y="530" width="26" height="24" fill="#7c8a58" transform="rotate(-12 611 542)"/>

  <!-- bike leaning -->
  <g transform="rotate(-10 700 500)" fill="none" stroke="#2e3943" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="650" cy="505" r="42"/>
    <circle cx="760" cy="505" r="42"/>
    <path d="M650 505l40-52h52l18 52M690 453l16 52h-56M706 505l36-52M690 453l-2-11M680 442h20M742 453l-6-22h16"/>
  </g>

  <!-- scattered debris -->
  <g fill="#5d574d">
    <rect x="455" y="455" width="10" height="5" transform="rotate(-15 460 457)"/>
    <circle cx="470" cy="598" r="3"/>
    <circle cx="690" cy="585" r="3"/>
    <circle cx="360" cy="590" r="2.5"/>
    <circle cx="560" cy="440" r="2.5"/>
    <rect x="130" y="420" width="16" height="5" rx="1" fill="#8a6a3c" transform="rotate(30 138 422)"/>
  </g>

  <!-- dust in the air -->
  <g fill="#f5efe0" opacity=".35">
    <circle cx="300" cy="120" r="2"/>
    <circle cx="360" cy="160" r="1.5"/>
    <circle cx="480" cy="90" r="2"/>
    <circle cx="520" cy="230" r="1.5"/>
    <circle cx="250" cy="240" r="1.5"/>
    <circle cx="420" cy="270" r="2"/>
  </g>

  <rect width="800" height="600" fill="url(#dim)"/>
</svg>
