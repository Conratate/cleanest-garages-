  <path d="M404 578c-22 0-32-20-27-43 5-25 24-41 46-41 6-9 19-9 24 0 25 5 37 26 35 48-2 23-17 36-36 36z" fill="#25272a"/>
  <path d="M426 512c11-2 21 5 25 15" fill="none" stroke="#474b52" stroke-width="4" stroke-linecap="round"/>
  <path d="M445 494l-6-12m12 12l6-12" stroke="#25272a" stroke-width="5" stroke-linecap="round"/>
  <path d="M466 560c-16 0-22-14-18-28 4-14 16-20 28-18 14 3 20 16 16 30-3 11-12 16-26 16z" fill="#1a1c1f"/>

  <!-- tire and garden hose -->
