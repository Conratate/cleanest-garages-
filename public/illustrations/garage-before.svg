  <rect x="18" y="455" width="142" height="112" fill="#bd8d56"/>
  <rect x="18" y="455" width="142" height="12" fill="#cf9f68"/>
  <rect x="83" y="455" width="12" height="112" fill="#e0c68f" opacity=".85"/>
