  <rect x="218" y="172" width="44" height="42" fill="#a6773f" transform="rotate(9 240 193)"/>
  <rect x="268" y="176" width="26" height="36" rx="3" fill="#6f7f8c"/>
  <rect x="266" y="172" width="30" height="6" rx="2" fill="#56636e"/>
  <rect x="296" y="164" width="22" height="46" fill="#c7b078" transform="rotate(14 307 187)"/>
