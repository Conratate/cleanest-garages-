<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <title>Illustration of a cluttered, dirty garage</title>
  <defs>
    <linearGradient id="dim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1408" stop-opacity=".08"/>
      <stop offset="1" stop-color="#1b1408" stop-opacity=".3"/>
    </linearGradient>
    <radialGradient id="bulb" cx="50%" cy="0%" r="60%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grit" width="18" height="14" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="4" r="1" fill="#5d574d" opacity=".5"/>
      <circle cx="12" cy="10" r=".8" fill="#5d574d" opacity=".4"/>
    </pattern>
  </defs>

  <!-- room -->
  <rect x="110" y="40" width="580" height="360" fill="#b5a88f"/>
  <polygon points="0,0 800,0 690,40 110,40" fill="#857c6b"/>
  <polygon points="0,0 110,40 110,400 0,600" fill="#998e78"/>
  <polygon points="800,0 690,40 690,400 800,600" fill="#a09580"/>
  <polygon points="110,400 690,400 800,600 0,600" fill="#7a746a"/>
  <polygon points="110,400 690,400 800,600 0,600" fill="url(#grit)"/>
  <rect x="110" y="386" width="580" height="14" fill="#6c6456" opacity=".6"/>

  <!-- ceiling beams + exposed wiring -->
  <g stroke="#6f6758" stroke-width="3" opacity=".6">
    <path d="M40 15L150 44M760 15L650 44M250 0L270 40M530 0L515 40"/>
  </g>
  <path d="M470 40q20 18 44 6t40 10" fill="none" stroke="#2d2a24" stroke-width="2"/>

  <!-- wall grime, water stains, peeling paint -->
  <g fill="#86795f">
