  <path d="M74 186h38M78 186v14M86 186v14M94 186v14M102 186v14M110 186v14" stroke="#555" stroke-width="3" stroke-linecap="round"/>
  <path d="M30 480L50 250" stroke="#8a6a3c" stroke-width="5" stroke-linecap="round"/>
  <path d="M40 250q10-26 22 0l-4 20h-14z" fill="#6b7280"/>

