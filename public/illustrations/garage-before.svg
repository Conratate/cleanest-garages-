  <!-- center pile -->
  <rect x="232" y="472" width="150" height="100" fill="#b98b55"/>
  <rect x="232" y="472" width="150" height="11" fill="#cb9c66"/>
  <rect x="300" y="472" width="12" height="100" fill="#e0c68f" opacity=".85"/>
  <path d="M240 540l24 20M360 490l14 30" stroke="#8f6232" stroke-width="2" opacity=".6"/>
  <text x="318" y="530" font-family="sans-serif" font-size="11" font-weight="700" fill="#7a5227">GARAGE</text>
  <g transform="rotate(7 300 447)">
    <rect x="250" y="420" width="100" height="56" fill="#c49660"/>
    <rect x="295" y="420" width="10" height="56" fill="#e0c68f" opacity=".85"/>
