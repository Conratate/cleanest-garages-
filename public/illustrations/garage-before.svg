  <circle cx="452" cy="140" r="9" fill="#6e6e6e"/>
  <path d="M420 120c-30 20 30 30 0 50s40 20 10 45c-12 10 20 20 30 5s-40-10-20-30 30-10 10-30" fill="none" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>
  <path d="M372 225l6 20" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>

