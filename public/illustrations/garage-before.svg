    <path d="M136 40q-4 18-26 22M160 40q-8 38-50 46M182 40q-12 58-72 70"/>
    <path d="M690 40h-62M690 40v62M690 40l-48 50M690 40l-24 58"/>
    <path d="M668 40q4 16 22 18M646 40q6 36 44 40"/>
    <path d="M110 400v-40M110 400l30-30M110 400l38-10M110 380q12 4 18 20"/>
