  <path d="M150 600l40-60 30-10 20-40M620 600l-20-40 18-30M360 470l-40 20-10 30" fill="none" stroke="#4a453d" stroke-width="2" opacity=".7"/>
  <g fill="#3b362e">
    <ellipse cx="420" cy="585" rx="90" ry="14" opacity=".5"/>
    <ellipse cx="600" cy="430" rx="46" ry="9" opacity=".45"/>
    <ellipse cx="190" cy="592" rx="60" ry="9" opacity=".4"/>
    <ellipse cx="300" cy="440" rx="34" ry="7" opacity=".35"/>
    <ellipse cx="700" cy="470" rx="30" ry="6" opacity=".4"/>
