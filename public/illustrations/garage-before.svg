  <rect x="612" y="332" width="66" height="56" rx="5" fill="#4b4741"/>
  <rect x="620" y="340" width="44" height="38" rx="6" fill="#2c2a27"/>
  <path d="M626 346l12 8" stroke="#5c5850" stroke-width="3"/>
  <circle cx="671" cy="350" r="2.5" fill="#8a8479"/>
  <circle cx="671" cy="362" r="2.5" fill="#8a8479"/>
  <rect x="412" y="352" width="70" height="42" rx="4" fill="#b91c1c"/>
  <rect x="408" y="344" width="78" height="12" rx="4" fill="#e5e1d8"/>
