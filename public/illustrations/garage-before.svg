  <g transform="rotate(5 100 360)">
    <path d="M88 330l-18-62" stroke="#6b7280" stroke-width="6" stroke-linecap="round"/>
    <path d="M112 332l12-48" stroke="#9a3412" stroke-width="5" stroke-linecap="round"/>
    <circle cx="124" cy="282" r="8" fill="none" stroke="#9a3412" stroke-width="4"/>
    <rect x="58" y="336" width="84" height="52" fill="#c49660"/>
    <path d="M58 336l-14-18h40l10 18zM142 336l14-18h-40l-10 18z" fill="#d7ac75"/>
  </g>

